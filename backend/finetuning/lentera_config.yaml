# =================================================
# LENTERA – OPTIMIZED CONFIG FOR RUNPOD/GPU
# =================================================

base_model: unsloth/Meta-Llama-3.1-8B
model_type: LlamaForCausalLM
tokenizer_type: AutoTokenizer

# Chat format untuk Llama 3.1
chat_template: llama3

# Jangan strict, biar metadata di jsonl diabaikan
strict: false

# 4bit untuk efisiensi
load_in_4bit: true

# =====================
# DATASET (CHAT JSONL)
# =====================
datasets:
  - path: train.jsonl
    type: chat
    split: train

eval_dataset:
  - path: val.jsonl
    type: chat
    split: eval

# =====================
# LoRA (PARAMETER TUNING)
# =====================
adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - down_proj
  - up_proj

# =====================
# TRAINING PARAMETERS
# =====================
micro_batch_size: 2
gradient_accumulation_steps: 8
num_epochs: 3

learning_rate: 2e-4
lr_scheduler: cosine
warmup_ratio: 0.03

# PENTING: Jangan latih input user
train_on_inputs: false

# =====================
# PERFORMANCE (GPU OPTIMIZED)
# =====================
bf16: true
tf32: true

# Flash attention OFF (biar kompatibel semua GPU)
flash_attention: false

# Gradient checkpointing untuk hemat VRAM
gradient_checkpointing: true

# =====================
# OUTPUT & LOGGING
# =====================
output_dir: ./lentera-lora-output
logging_steps: 10
save_steps: 200
save_total_limit: 2

# Evaluation
eval_steps: 100
evaluation_strategy: steps

# Seed untuk reproducibility
seed: 42

# =====================
# SPECIAL TOKENS
# =====================
special_tokens:
  bos_token: "<s>"
  eos_token: "</s>"
  unk_token: "<unk>"
  pad_token: "[PAD]"
