# Nginx configuration for LenteraDreamFlow Backend
# Save to: /etc/nginx/sites-available/lentera-api

server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain or IP

    # Increase buffer size for large requests
    client_max_body_size 50M;

    location / {
        # Proxy to FastAPI backend
        proxy_pass http://localhost:8000;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts (important for AI responses)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint (bypass proxy for faster response)
    location /health {
        proxy_pass http://localhost:8000/health;
        proxy_read_timeout 5s;
    }

    # Access and error logs
    access_log /var/log/nginx/lentera-access.log;
    error_log /var/log/nginx/lentera-error.log;
}

